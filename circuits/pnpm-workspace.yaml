minimumReleaseAgeExclude:
  - '@noir-lang/acvm_js@1.0.0-rc.5'
  - '@noir-lang/noir_js@1.0.0-rc.5'
  - '@noir-lang/noirc_abi@1.0.0-rc.5'
  - '@noir-lang/types@1.0.0-rc.5'
# Build scripts are not needed: esbuild ships its platform binary as an optional dependency, and
# msgpackr-extract is an optional native accelerator.
allowBuilds:
  esbuild: false
  msgpackr-extract: false
