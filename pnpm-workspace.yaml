packages:
  - "apps/*"
  - "packages/*"
  - "bench"

catalog:
  typescript: 5.9.3
  viem: 2.57.7
  zod: 4.6.7
  vitest: 5.0.5
  "@types/node": 24.19.2
  tsx: 4.23.15
  ox: 0.14.56
  hono: 4.13.13
  "@hono/node-server": 2.1.5
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@noble/hashes": 2.4.0
  "@noble/curves": 2.4.0

minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - vitest@5.0.5

allowBuilds:
  esbuild: true

# Next 16.4.1 image optimisation depends on sharp; the 14 Oct 2026 advisory needs >= 0.35.5.
overrides:
  sharp: ">=0.35.5"
