<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YINGLONG</title>
<style>
:root { --obsidian:#0b0c0e; --bone:#e9e6df; --ash:#8a8d93; --steel:#9fb3c8; }
* { margin:0; box-sizing:border-box; }
body { min-height:100vh; display:grid; place-items:center; background:var(--obsidian); color:var(--bone);
       font:16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px; }
main { text-align:center; max-width:560px; }
.ring { width:72px; height:72px; margin:0 auto 32px; border-radius:50%; border:1.5px solid var(--ash); position:relative; }
.ring::after { content:""; position:absolute; width:10px; height:10px; border-radius:50%; background:var(--bone);
               top:-5px; left:50%; margin-left:-5px; box-shadow:0 0 12px var(--steel); }
h1 { font-weight:600; letter-spacing:.32em; font-size:28px; margin-bottom:12px; }
p { color:var(--ash); }
.tag { margin-top:28px; font:12px ui-monospace, monospace; letter-spacing:.12em; color:var(--steel); text-transform:uppercase; }
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true"></div>
  <h1>YINGLONG</h1>
  <p>Personal Agent Identity &amp; Mandated Finance</p>
  <p class="tag">A Shadow Chaser innovation &middot; launching soon</p>
</main>
</body>
</html>
