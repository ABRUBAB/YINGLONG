# YINGLONG application stack on the VPS. Every service listens on 127.0.0.1 only; Caddy (edge) is the
# only public entry point. FISCO BCOS runs natively on the host (systemd) at 127.0.0.1:8545.
name: yinglong
x-node: &node
  image: yinglong/node:latest
  build: { context: ../.., dockerfile: infra/app/Dockerfile }
  network_mode: host
  restart: unless-stopped
  environment: &env
    YINGLONG_ROOT: /app
    YINGLONG_SECRETS: /run/secrets/testnet-keys.json
    OPENROUTER_KEY_FILE: /run/secrets/openrouter.txt
    FISCO_RPC_URL: http://127.0.0.1:8545
    BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
    NADIA_LEDGER: ${NADIA_LEDGER:-fisco}
    LOTUS_SZ_LEDGER: fisco
    RUN_ID: ${RUN_ID:-v1}
    RUN_ID_GUEST: ${RUN_ID_GUEST:-live1}
    # Demo time compression (labelled in the UI): budget periods of one day instead of 30 days.
    DEMO_PERIOD_SECONDS: ${DEMO_PERIOD_SECONDS:-86400}
    SIGNER_URL: http://127.0.0.1:8788
    BREAKER_URL: http://127.0.0.1:8791/breaker/trip
    SENTINEL_URL: ${SENTINEL_URL:-}
    GIT_COMMIT: ${GIT_COMMIT:-}
  volumes:
    - /opt/yinglong/secrets/testnet-keys.json:/run/secrets/testnet-keys.json:ro
    - /opt/yinglong/secrets/openrouter.txt:/run/secrets/openrouter.txt:ro
services:
  signer:
    <<: *node
    command: ["npx", "tsx", "apps/signer/src/server.ts"]
  agent:
    <<: *node
    command: ["npx", "tsx", "apps/agent/src/server.ts"]
    environment:
      <<: *env
      AGENT_DATA_DIR: /data
      AGENT_ADMIN_TOKEN_FILE: /run/secrets/admin-token.txt
      # M1 injection sentinel (ml service below, 127.0.0.1:8090). The agent calls it with a 4 s timeout and falls back
      # to the labelled regex sentinel if it is down or slow; it can only raise a tier.
      SENTINEL_URL: http://127.0.0.1:8090
      # Alibaba Cloud Model Studio (DashScope, Qwen) key: bare key value, written by scripts/vps-deploy.mjs --secrets.
      DASHSCOPE_KEY_FILE: /run/secrets/dashscope.txt
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    volumes:
      - /opt/yinglong/secrets/admin-token.txt:/run/secrets/admin-token.txt:ro
      - /opt/yinglong/secrets/testnet-keys.json:/run/secrets/testnet-keys.json:ro
      - /opt/yinglong/secrets/openrouter.txt:/run/secrets/openrouter.txt:ro
      - /opt/yinglong/secrets/dashscope.txt:/run/secrets/dashscope.txt:ro
      - /opt/yinglong/data/agent:/data
    depends_on: [signer]
  services:
    <<: *node
    command: ["npx", "tsx", "apps/services/src/main.ts"]
    environment:
      <<: *env
      LEDGER: fisco
      RPC_URL: http://127.0.0.1:8545
      SERVICES_PUBLIC_URL: https://api.yinglong-agent.tech
  ecny-sim:
    <<: *node
    command: ["npx", "tsx", "apps/ecny-sim/src/main.ts"]
    environment:
      <<: *env
      ECNY_LEDGER: fisco
      ECNY_STATE_DIR: /data
      ECNY_ADMIN_TOKEN_FILE: /run/secrets/admin-token.txt
    volumes:
      - /opt/yinglong/secrets/testnet-keys.json:/run/secrets/testnet-keys.json:ro
      - /opt/yinglong/secrets/admin-token.txt:/run/secrets/admin-token.txt:ro
      - /opt/yinglong/data/ecny:/data
  indexer:
    <<: *node
    command: ["npx", "tsx", "apps/indexer/src/main.ts"]
    environment:
      <<: *env
      ANCHOR_LEDGERS: ${ANCHOR_LEDGERS:-fisco,base-sepolia}
      AGENT_API_URL: http://127.0.0.1:8787
      INDEXER_DATA_DIR: /data
      FISCO_PROXY_UPSTREAM: http://127.0.0.1:8549
      # Native RPC of the observer (regulator) node, for exact revert data of failed transactions (read only).
      FISCO_NATIVE_RPC_URL: https://127.0.0.1:20204
      FISCO_SDK_DIR: /run/secrets/fisco-sdk
    volumes:
      - /opt/yinglong/secrets/testnet-keys.json:/run/secrets/testnet-keys.json:ro
      - /opt/yinglong/fisco/nodes/127.0.0.1/sdk:/run/secrets/fisco-sdk:ro
      - /opt/yinglong/data/indexer:/data
    depends_on: [agent]
  # M1 injection sentinel (ml/serving, CPU only). The image holds no weights and no token: at start the container
  # downloads the revisions pinned in ml/serving/models.lock.json into the named volume ml-models, verifying every
  # SHA-256 (it stops on a mismatch). The HuggingFace READ token is the file written by scripts/vps-deploy.mjs --secrets.
  # Only M1 is loaded (the agent calls /sentinel only); the 3 GiB cap covers the int8 mmBERT-base session.
  ml:
    image: yinglong/ml:latest
    build: { context: ../../ml/serving }
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      YL_MODELS: ${YL_MODELS:-m1,m3,m5}
      YL_ORT_THREADS: "2"
      HF_TOKEN_FILE: /run/secrets/hf-token.txt
    command: ["uvicorn", "app:app", "--host", "127.0.0.1", "--port", "8090", "--workers", "1"]
    volumes:
      - /opt/yinglong/secrets/hf-token.txt:/run/secrets/hf-token.txt:ro
      - ml-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
  web:
    image: yinglong/web:latest
    build: { context: ../.., dockerfile: infra/web/Dockerfile }
    network_mode: host
    restart: unless-stopped
volumes:
  ml-models: {}
