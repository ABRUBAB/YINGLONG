[project]
name = "yinglong-verify"
version = "0.1.0"
description = "Independent Python verifier for YINGLONG mandates, delegations, transactions and accountability receipts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "YINGLONG team" }]
keywords = ["erc-7710", "delegation", "mandate", "verification", "eip-712"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "eth-abi>=5.1,<6",
    "pycryptodome>=3.20,<4",
]

[project.scripts]
yinglong = "yinglong_verify.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yinglong_verify"]

[tool.hatch.build.targets.sdist]
include = ["src/yinglong_verify", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
