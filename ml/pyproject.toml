[project]
name = "yinglong-ml"
version = "0.1.0"
description = "YINGLONG ML tooling: bench generation, sentinel, intent, anomaly and forecast models"
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface-hub>=0.35",
  "datasets>=4.0",
  "kaggle>=1.7",
  "openai>=1.100",
  "jsonschema>=4.23",
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "lightgbm>=4.6",
  "pyarrow>=18",
  "tqdm>=4.66",
]

[dependency-groups]
cpu-models = [
  "torch>=2.8",
  "transformers>=4.56",
  "onnx>=1.18",
  "onnxruntime>=1.22",
  "chronos-forecasting>=2.0",
  "tokenizers>=0.21",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "onnx-ir>=1.0.0",
  "peft>=0.21.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
