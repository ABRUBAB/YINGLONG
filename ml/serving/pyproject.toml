[project]
name = "yinglong-ml-serving"
version = "0.1.0"
description = "CPU-only FastAPI service for YINGLONG ML signals: M1 sentinel (ONNX int8), M3 anomaly, M5 forecast"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "onnxruntime>=1.22",
  "tokenizers>=0.21",
  "numpy>=2.1",
  "scikit-learn>=1.6",
  "lightgbm>=4.6",
  "huggingface-hub>=0.35",
  "pydantic>=2.9",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3"]

[tool.uv]
package = false
