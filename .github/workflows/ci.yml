name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: repository rules (English only, no secrets, no working files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-rules.mjs --history
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner .

  contracts:
    name: contracts (Foundry)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: forge build --sizes
      - run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci

  typescript:
    name: typescript (mandate, sdk, agent, signer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile --filter "@yinglong/*..."
      - run: pnpm --filter @yinglong/mandate test
      - run: pnpm --filter @yinglong/mandate typecheck
      - run: pnpm --filter @yinglong/sdk typecheck
      - run: pnpm --filter @yinglong/agent typecheck
      - run: pnpm --filter @yinglong/signer typecheck

  verify-py:
    name: yinglong verify (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/verify-py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 pytest -q
      - run: uv run --python 3.12 yinglong verify nadia --chain anvil --offline
