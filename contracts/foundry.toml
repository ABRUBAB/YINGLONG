[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.23"
auto_detect_solc = false
# london keeps the bytecode valid on FISCO BCOS 3.x (no PUSH0, no MCOPY, no TSTORE).
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/vectors" }, { access = "read", path = "./out" }]
gas_reports = ["*"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.invariant]
runs = 256
depth = 128

[profile.deep.invariant]
runs = 2048
depth = 256

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 132
multiline_func_header = "all"
number_underscore = "preserve"
quote_style = "double"
tab_width = 4
wrap_comments = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
fisco = "${FISCO_RPC_URL}"
